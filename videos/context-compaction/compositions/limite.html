  <script>
    (function () {
      // Host starts at 50.3 s; times below are film seconds.
      const S = 50.3;
      const at = (g) => +(g - S).toFixed(3);
      const tl = gsap.timeline({ paused: true });

      // Token curve: ILLUSTRATIVE values. The conversation climbs to the 85 %
      // line, a light model summarises, the context drops to the summary's
      // size and keeps growing slowly from there.
      const PLOT = { x0: 70, x1: 940, y0: 405, y1: 75 };
      const LIMIT = 0.85;
      const EVENTS = [
        [0.0, 0.36], [0.06, 0.42], [0.12, 0.47], [0.18, 0.53], [0.24, 0.58],
        [0.3, 0.64], [0.36, 0.69], [0.42, 0.74], [0.48, 0.79], [0.56, LIMIT],
        [0.62, 0.2], [0.68, 0.23], [0.74, 0.26], [0.8, 0.29],
      ];
      const X = (f) => PLOT.x0 + (PLOT.x1 - PLOT.x0) * f;
      const Y = (f) => PLOT.y0 - (PLOT.y0 - PLOT.y1) * f;
      let d = `M ${X(0)} ${Y(EVENTS[0][1])}`;
      for (const [x, v] of EVENTS.slice(1)) d += ` H ${X(x)} V ${Y(v)}`;
      document.getElementById("li-line").setAttribute("d", d);
      document.getElementById("li-area").setAttribute("d", `${d} V ${PLOT.y0} H ${X(0)} Z`);
      gsap.set("#li-limit", { attr: { y1: Y(LIMIT), y2: Y(LIMIT) } });
      const reveal = (f) => `inset(-60px ${(980 - X(f)).toFixed(1)}px -20px 0px)`;
      const lineReveal = (f) => `inset(0px ${(980 * (1 - f)).toFixed(1)}px 0px 0px)`;
      let shown = 0;
      const grow = (to, g, n) => {
        PC.steps(tl, "#li-reveal", shown, to, at(g), 0.18, n || 3, reveal);
        shown = to;
      };

      const ROT = { phone: -3, badge: 3, less: -3, title: -2, tag: 2 };
      gsap.set("#li-phone-wrap", { rotation: ROT.phone, opacity: 0 });
      gsap.set("#li-card-wrap", { opacity: 0 });
      gsap.set("#li-badge-wrap", { rotation: ROT.badge, opacity: 0 });
      gsap.set("#li-less", { rotation: ROT.less, opacity: 0 });
      gsap.set("#li-card-title", { rotation: ROT.title, opacity: 0 });
      gsap.set("#li-limit-tag", { rotation: ROT.tag, opacity: 0 });
      gsap.set("#li-reveal", { clipPath: reveal(0) });
      gsap.set("#li-limit-svg", { clipPath: lineReveal(0) });
      gsap.set("#li-tip", { attr: { cx: X(EVENTS[9][0]), cy: Y(LIMIT) }, opacity: 0 });
      gsap.set(["#li-b1", "#li-b2", "#li-sum", "#li-b3", "#li-b4"], { display: "none" });
      gsap.set(".bub.out", { transformOrigin: "100% 0%" });
      gsap.set(".bub.in", { transformOrigin: "0% 0%" });
      gsap.set("#li-sum", { transformOrigin: "50% 0%" });
      const bubble = (sel, g) => {
        tl.set(sel, { display: "block" }, at(g));
        tl.fromTo(sel, { scale: 0.75 }, { scale: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, at(g));
      };

      // 50.3: back to the home stage.
      PC.slap(tl, "#li-phone-wrap", at(50.3), { rot: ROT.phone, from: 1.08, dy: 120, spin: -4, dur: 0.3 });
      PC.slap(tl, "#li-card-wrap", at(50.46), { from: 1.05, dy: 90, spin: 1.5, dur: 0.3 });
      PC.slap(tl, "#li-card-title", at(50.6), { rot: ROT.title });
      grow(0.2, 50.5);
      bubble("#li-b1", 50.9);
      bubble("#li-b2", 51.6);

      // "¿Cómo funciona? Cuando la conversación alcanza…": the climb, step by step.
      grow(0.26, 51.4);
      grow(0.32, 51.9);
      grow(0.38, 52.4);
      grow(0.44, 52.9);
      // "límite de tokens" (53.15): the 85 % line is drawn, then the curve meets it.
      PC.steps(tl, "#li-limit-svg", 0, 1, at(53.1), 0.4, 6, lineReveal);
      PC.slap(tl, "#li-limit-tag", at(53.5), { rot: ROT.tag, from: 1.25 });
      grow(0.5, 53.3);
      grow(0.58, 53.65);
      tl.set("#li-tip", { opacity: 1 }, at(53.9));
      tl.fromTo("#li-tip", { attr: { r: 26 } }, { attr: { r: 13 }, duration: 0.2, ease: "back.out(2)", immediateRender: false }, at(53.9));

      // "un modelo un poco más ligero" (54.89).
      PC.slap(tl, "#li-badge-wrap", at(54.9), { rot: ROT.badge, from: 1.1, dx: 320, dy: 0, spin: 8, dur: 0.3 });
      // "resumir todos los eventos" (56.88): the old bubbles fold into the summary.
      tl.to("#li-b1", { scaleY: 0, duration: 0.16, ease: "power2.in" }, at(56.9));
      tl.to("#li-b2", { scaleY: 0, duration: 0.16, ease: "power2.in" }, at(57.0));
      tl.set(["#li-b1", "#li-b2"], { display: "none" }, at(57.16));
      bubble("#li-sum", 57.16);
      PC.pull(tl, "#li-badge-wrap", at(60.1), { rot: ROT.badge, toX: 600, toY: -400, dur: 0.24 });

      // "el bot no pierde memoria" (63.12): the camera pushes into the phone so the
      // question and the answer it still knows read on a phone screen, then pulls back
      // to the chart before the drop.
      tl.to("#li-phone-wrap", { scale: 1.5, x: 240, y: 180, duration: 0.5, ease: "power2.inOut" }, at(61.6));
      bubble("#li-b3", 62.2);
      bubble("#li-b4", 63.3);
      tl.to("#li-phone-wrap", { scale: 1, x: 0, y: 0, duration: 0.45, ease: "power2.inOut" }, at(65.25));

      // "drásticamente" (66.02): the drop. A beat of stillness before it.
      grow(0.64, 66.0, 2);
      tl.set("#li-tip", { attr: { cx: X(EVENTS[10][0]), cy: Y(EVENTS[10][1]) } }, at(66.06));
      tl.fromTo("#li-tip", { attr: { r: 28 } }, { attr: { r: 13 }, duration: 0.28, ease: "back.out(2.4)", immediateRender: false }, at(66.06));
      PC.slap(tl, "#li-less", at(66.6), { rot: ROT.less, from: 1.3, dy: -40 });
      grow(0.7, 66.7);
      tl.set("#li-tip", { attr: { cx: X(EVENTS[11][0]), cy: Y(EVENTS[11][1]) } }, at(66.8));
      grow(0.76, 67.1);
      tl.set("#li-tip", { attr: { cx: X(EVENTS[12][0]), cy: Y(EVENTS[12][1]) } }, at(67.3));

      // 67.6: cleared for the code.
      PC.pull(tl, "#li-phone-wrap", at(67.6), { rot: ROT.phone, toX: -300, dur: 0.22 });
      PC.pull(tl, "#li-less", at(67.6), { rot: ROT.less, toX: 500, dur: 0.22 });
      PC.pull(tl, "#li-card-wrap", at(67.64), { toY: 1400, spin: -4, dur: 0.22 });
      tl.set({}, {}, 17.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["limite"] = tl;
    })();
  </script>
