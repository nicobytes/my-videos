  <script>
    (function () {
      // Host starts at 7.0 s; times below are written in film seconds.
      const S = 7.0;
      const at = (g) => +(g - S).toFixed(3);
      const tl = gsap.timeline({ paused: true });
      const ROT = { card: -1, title: -2, label: 3 };

      // Full frame: the torn photo sits 992 px up (its edge above the frame) and
      // its picture 992 px down, so the console fills the frame.
      gsap.set("#con-photo", { y: -992 });
      gsap.set("#con-cam", { y: 992, scale: 1, transformOrigin: "300px 560px" });
      gsap.set("#con-card-wrap", { rotation: ROT.card, opacity: 0 });
      gsap.set("#con-title", { rotation: ROT.title, opacity: 0 });
      gsap.set("#con-peak-label", { rotation: ROT.label, opacity: 0 });
      gsap.set(".con-bar", { scaleY: 0 });
      gsap.set("#con-peak-fill", { scaleY: 0 });

      // "Google Cloud Console": a slow push toward the monitor.
      tl.to("#con-cam", { scale: 1.07, duration: 1.6, ease: "power1.inOut" }, at(7.45));

      // 9.0: the photo drops into the bottom half; the monitor rides down with it.
      tl.to("#con-photo", { y: 0, duration: 0.6, ease: "power2.inOut" }, at(9.0));
      tl.to("#con-cam", { y: 722, scale: 1, duration: 0.6, ease: "power2.inOut" }, at(9.0));

      // 9.3: the billing chart is slapped on above it, then its title.
      PC.slap(tl, "#con-card-wrap", at(9.3), { rot: ROT.card, from: 1.06, dy: -70, spin: 2.5, dur: 0.28 });
      PC.slap(tl, "#con-title", at(9.5), { rot: ROT.title });

      // The days arrive one by one, on twos.
      gsap.utils.toArray(".con-bar").forEach((bar, i) => {
        tl.to(bar, { scaleY: 1, duration: 0.24, ease: "steps(4)" }, at(9.65 + i * 0.1));
      });

      // "elevados" (11.42): the peak fills yellow and gets its label.
      tl.to("#con-peak-fill", { scaleY: 1, duration: 0.25, ease: "power3.out" }, at(11.4));
      PC.slap(tl, "#con-peak-label", at(11.5), { rot: ROT.label, from: 1.2 });

      // 11.75: chart pulled off the top, photo slides off the bottom.
      PC.pull(tl, "#con-card-wrap", at(11.75), { rot: ROT.card, toY: -1500, spin: 6, dur: 0.24 });
      tl.to("#con-photo", { y: 1000, duration: 0.24, ease: "power3.in" }, at(11.76));
      tl.set({}, {}, 5);

      window.__timelines = window.__timelines || {};
      window.__timelines["consola"] = tl;
    })();
  </script>
