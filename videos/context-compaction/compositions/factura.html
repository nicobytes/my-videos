  <script>
    (function () {
      // Host starts at 25.3 s; times below are film seconds.
      const S = 25.3;
      const at = (g) => +(g - S).toFixed(3);
      const tl = gsap.timeline({ paused: true });
      const ROT = { receipt: -2, stamp: -9, me: 3 };

      gsap.set("#fa-receipt-wrap", { rotation: ROT.receipt, opacity: 0 });
      gsap.set("#fa-stamp", { rotation: ROT.stamp, opacity: 0 });
      gsap.set("#fa-me", { rotation: ROT.me, opacity: 0 });
      // Face (source y≈20–450) sits at canvas y≈970–1400, above the captions.
      gsap.set("#fa-cam", { y: 950 });
      gsap.set("#fa-photo", { y: 1000 });
      gsap.set(".fa-row .bar", { scaleX: 0 });
      gsap.set(".fa-row .lbl", { opacity: 0 });
      gsap.set("#fa-over", { scaleX: 0 });

      // 25.32: the receipt drops in from the top; the photo rises from the bottom.
      PC.slap(tl, "#fa-receipt-wrap", at(25.32), { rot: ROT.receipt, from: 1.04, dy: -140, spin: 4, dur: 0.3 });
      tl.to("#fa-photo", { y: 0, duration: 0.45, ease: "expo.out" }, at(25.36));

      // "más contexto… más tokens… la factura": every call prints a longer line.
      const rows = [["#fa-r1", 25.6], ["#fa-r2", 26.0], ["#fa-r3", 26.45], ["#fa-r4", 26.85], ["#fa-r5", 27.45], ["#fa-r6", 28.1]];
      rows.forEach(([r, g]) => {
        tl.set(r + " .lbl", { opacity: 1 }, at(g));
        tl.to(r + " .bar", { scaleX: 1, duration: 0.22, ease: "steps(5)" }, at(g + 0.04));
      });
      // "se dispara" (28.99): the last line shoots off the paper.
      tl.set("#fa-r7 .lbl", { opacity: 1 }, at(28.9));
      tl.to("#fa-over", { scaleX: 1, duration: 0.35, ease: "power4.out" }, at(28.95));
      PC.slap(tl, "#fa-stamp", at(29.05), { rot: ROT.stamp, from: 1.5, spin: 12, dur: 0.2 });

      // "Me pasó exactamente eso" (30.5).
      PC.slap(tl, "#fa-me", at(30.55), { rot: ROT.me, from: 1.2, dx: -40 });

      // 33.0: torn away onto the keyboard shot.
      PC.rip(tl, "#fa-sheet", "#fa-inner", "#fa-rim", at(33.0), { dur: 0.45, seed: 23 });
      tl.set({}, {}, 8.15);

      window.__timelines = window.__timelines || {};
      window.__timelines["factura"] = tl;
    })();
