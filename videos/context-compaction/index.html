    <script>
      /* Paper-cut motion kit, shared by every scene. Everything is a tween on
         the scene's paused timeline: seek-safe, no callbacks, no clocks. */
      // Every tween must write on the frame it is seeked to: no lazy first render.
      gsap.defaults({ lazy: false });
      window.PC = (function () {
        // A piece of paper is slapped down: slight overshoot, no fade.
        function slap(tl, sel, t, o) {
          o = o || {};
          const r = o.rot || 0;
          tl.set(sel, { opacity: 1 }, t);
          tl.fromTo(
            sel,
            { scale: o.from || 1.12, x: o.dx || 0, y: o.dy === undefined ? -18 : o.dy, rotation: r + (o.spin === undefined ? 3 : o.spin) },
            { scale: 1, x: 0, y: 0, rotation: r, duration: o.dur || 0.22, ease: "expo.out", immediateRender: false, lazy: false },
            t,
          );
        }
        // Lifted, then pulled off frame in one accelerating move.
        function pull(tl, sel, t, o) {
          o = o || {};
          const r = o.rot || 0;
          tl.to(sel, { y: -22, rotation: r + 3, duration: 0.1, ease: "power2.out", lazy: false }, t);
          tl.to(sel, { x: o.toX || 0, y: o.toY === undefined ? -1500 : o.toY, rotation: r + (o.spin || 9), duration: o.dur || 0.3, ease: "power3.in", lazy: false }, t + 0.1);
          tl.set(sel, { opacity: 0 }, t + 0.1 + (o.dur || 0.3));
        }
        // A seeded torn edge (LCG), as polygons the tween interpolates point by point.
        function edge(seed, rows) {
          let st = seed >>> 0;
          const rnd = () => ((st = (Math.imul(1664525, st) + 1013904223) >>> 0) / 4294967296);
          const knots = [];
          for (let i = 0; i <= 6; i++) knots.push(rnd() * 2 - 1);
          const out = [];
          for (let i = 0; i <= rows; i++) {
            const v = i / rows, f = v * 6, k = Math.min(5, Math.floor(f)), u = f - k, w = u * u * (3 - 2 * u);
            out.push({ y: v * 1920, off: (knots[k] + (knots[k + 1] - knots[k]) * w) * 34 + (rnd() * 2 - 1) * 5 });
          }
          return out;
        }
        // The tear: the sheet keeps a static torn-edge mask and slides right while its
        // content slides left by the same amount, so the picture stays put and only
        // the edge travels. Transforms only (clip-path strings are never tweened).
        // Markup: <div sheet><div inner>…content…</div></div><div rim></div>
        function rip(tl, sheetSel, innerSel, rimSel, t, o) {
          o = o || {};
          const e = edge(o.seed || 0x7a9e11cf, 48);
          const pt = (r, dx) => (r.off + dx).toFixed(1) + "px " + r.y.toFixed(1) + "px";
          gsap.set(sheetSel, { clipPath: "polygon(" + e.map((r) => pt(r, 0)).concat(["2600px 1920px", "2600px 0px"]).join(", ") + ")" });
          gsap.set(rimSel, {
            clipPath: "polygon(" + e.map((r) => pt(r, -2)).concat(e.slice().reverse().map((r, i) => pt(r, 9 + ((i * 7) % 5)))).join(", ") + ")",
            opacity: 0,
          });
          const X0 = -90, X1 = 1180, dur = o.dur || 0.45, ease = o.ease || "power3.inOut";
          gsap.set([sheetSel, rimSel], { x: X0 });
          gsap.set(innerSel, { x: -X0 });
          tl.to([sheetSel, rimSel], { x: X1, duration: dur, ease }, t);
          tl.to(innerSel, { x: -X1, duration: dur, ease }, t);
          tl.set(rimSel, { opacity: 1 }, t);
          tl.set(rimSel, { opacity: 0 }, t + dur);
        }
        // Stop-motion reveal of a clip-path in discrete steps (paper is moved, not morphed).
        function steps(tl, sel, f0, f1, t, dur, n, fn) {
          for (let k = 1; k <= n; k++) tl.set(sel, { clipPath: fn(f0 + ((f1 - f0) * k) / n) }, +(t + (dur * k) / n).toFixed(3));
        }
        // Torn top edge of the bottom footage in a split, and the same edge flattened to the top of the frame.
        const XS = [0, 76, 151, 238, 324, 410, 497, 583, 670, 756, 842, 929, 1015, 1080];
        const SHOT_Y = [972, 984, 970, 988, 974, 990, 976, 986, 968, 988, 975, 991, 971, 982];
        const RIM_Y = [958, 966, 954, 970, 958, 973, 960, 969, 953, 971, 959, 974, 956, 966];
        const poly = (ys) => "polygon(" + XS.map((x, i) => x + "px " + ys[i] + "px").concat(["1080px 1920px", "0px 1920px"]).join(", ") + ")";
        const split = { shot: poly(SHOT_Y), rim: poly(RIM_Y), full: poly(XS.map(() => -20)) };
        return { slap, pull, rip, steps, split };
      })();
    </script>
