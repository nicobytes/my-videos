<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #b01-plate {
          position: absolute;
          left: 65px;
          top: 110px;
          width: 950px;
          height: 280px;
          background: #ffffff;
          border-radius: 32px;
          box-shadow: 0 14px 44px rgba(0, 0, 0, 0.25);
          display: flex;
          flex-wrap: wrap;
          align-content: center;
          justify-content: center;
          row-gap: 4px;
          padding: 0 44px;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
          font-size: 72px;
          font-weight: 700;
          line-height: 1.12;
          color: #075e54;
          text-align: center;
        }
        #b01-plate .w {
          display: inline-block;
          margin: 0 9px;
        }
      </style>

      <div id="root" data-composition-id="B01_hook" data-width="1080" data-height="1920">
        <div id="b01-plate">
          <span class="w" id="b01-w1">¿Usas</span><span class="w" id="b01-w2">WhatsApp</span><span class="w" id="b01-w3">para</span><span class="w" id="b01-w4">tener</span><span class="w" id="b01-w5">tus</span><span class="w" id="b01-w6">clientes?</span>
        </div>
      </div>

      <script>
        (function () {
          var B = /*BEATS*/;
          var tl = gsap.timeline({ paused: true });

          // Each word lands on its spoken time — kinetic-type, power4 settle, no overshoot
          B.hook.words.forEach(function (t, i) {
            tl.fromTo("#b01-w" + (i + 1), { autoAlpha: 0, y: 34 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power4.out" }, t);
          });
          // Emphasis on "clientes": a short scale pulse once the word has landed
          var tc = B.hook.words[5] + 0.12;
          tl.fromTo("#b01-w6", { scale: 1.12 }, { scale: 1, duration: 0.35, ease: "expo.out", immediateRender: false }, tc);
          // Exit: the plate lifts away while the brush bands open the split underneath
          tl.to("#b01-plate", { autoAlpha: 0, y: -60, duration: 0.25, ease: "power2.in" }, B.hook.exit + 0.1);
          tl.set("#b01-plate", { autoAlpha: 0 }, B.split.land); // hard kill at the scene boundary

          window.__timelines["B01_hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
