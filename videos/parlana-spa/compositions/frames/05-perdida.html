<!DOCTYPE html>
<html lang="es">
  <head><meta charset="UTF-8"><link rel="stylesheet" href="compositions/shared/pixel.css"></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Jersey 10"; src: url("assets/fonts/jersey10-latin.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Plus Jakarta Sans"; src: url("assets/fonts/plusjakarta-latin.woff2") format("woff2"); font-weight: 200 800; }
        #f05-root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1e3a33; }
        #f05-chat { left: 150px; top: 150px; width: 780px; height: 560px; background: #f1efe8; overflow: hidden; }
        #f05-chat .wa-head { font-size: 50px; }
        .f05-msg { position: absolute; font-size: 46px; }
        .f05-time { font-size: 30px; color: #888780; margin-left: 14px; }
        #f05-sign { left: 770px; top: 720px; font-size: 52px; background: #888780; color: #ffffff; }
        #f05-agenda { left: 110px; top: 150px; width: 860px; height: 520px; padding: 22px 26px; }
        #f05-agenda h3 { font-family: "Jersey 10", monospace; font-weight: 400; font-size: 64px; margin: 0 0 14px; }
        .f05-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
        .f05-day { font-family: "Jersey 10", monospace; font-size: 40px; text-align: center; }
        .f05-slot { height: 70px; background: #e6e3d8; border: 5px solid #888780; }
        #f05-empty { left: 330px; top: 420px; font-size: 96px; color: #888780; border: 10px solid #888780; background: #f1efe8; padding: 4px 30px; font-family: "Jersey 10", monospace; line-height: 1; }
      </style>

      <div id="f05-root" data-composition-id="f05" data-start="0" data-duration="4.66" data-width="1080" data-height="1920">
        <img class="px" src="assets/sprites/bg-spa-night.svg" style="left: 0; top: 0; width: 1080px;" alt="">
        <img class="px" src="assets/sprites/moon.svg" style="left: 190px; top: 260px; width: 80px;" alt="">
        <img id="f05-door" class="px" src="assets/sprites/door.svg" style="left: 790px; top: 820px; width: 260px;" alt="">
        <div id="f05-sign" class="tag notch">Otro spa</div>
        <img id="f05-cl0" class="px" src="assets/sprites/client-walk-1.svg" style="left: 330px; top: 1120px; width: 168px; visibility: hidden;" alt="">
        <img id="f05-cl0b" class="px" src="assets/sprites/client-walk-2.svg" style="left: 330px; top: 1120px; width: 168px; visibility: hidden;" alt="">
        <img id="f05-cl1" class="px" src="assets/sprites/client-walk-1.svg" style="left: 330px; top: 1120px; width: 168px; visibility: hidden;" alt="">
        <img id="f05-cl1b" class="px" src="assets/sprites/client-walk-2.svg" style="left: 330px; top: 1120px; width: 168px; visibility: hidden;" alt="">
        <img id="f05-vale" class="px" src="assets/sprites/vale-tired.svg" style="left: 60px; top: 972px; width: 308px;" alt="">
        <img class="px" src="assets/sprites/counter.svg" style="left: -60px; top: 1372px; width: 700px;" alt="">
        <img class="px" src="assets/sprites/plant.svg" style="left: 880px; top: 1250px; width: 168px;" alt="">

        <div id="f05-chat" class="panel notch">
          <div class="wa-head"><div class="dot" style="background:#e8796a"></div>Lucía</div>
          <div id="f05-m1" class="bub notch f05-msg" style="left: 24px; top: 130px;">¿Tienes turno hoy?<span class="f05-time">14:02</span></div>
          <div id="f05-m2" class="bub notch me f05-msg" style="right: 24px; top: 250px;">¡Hola! Sí, tenemos<span class="f05-time">23:41</span></div>
          <div id="f05-m3" class="bub notch gray f05-msg" style="left: 24px; top: 370px;">Ya reservé en otro spa</div>
        </div>

        <div id="f05-agenda" class="panel notch">
          <h3>Agenda de la semana</h3>
          <div class="f05-grid" id="f05-grid"></div>
        </div>
        <div id="f05-empty" class="notch" style="position:absolute">Vacía</div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          // local anchors (abs − 16.24): responde 0.75 · tarde 1.50 · las clientas 1.80 · otro spa 2.86 · agenda 3.48 · vacía 4.27
          var grid = document.getElementById("f05-grid");
          ["Lun", "Mar", "Mié", "Jue", "Vie"].forEach(function (d) { var e = document.createElement("div"); e.className = "f05-day"; e.textContent = d; grid.appendChild(e); });
          for (var i = 0; i < 15; i++) { var s = document.createElement("div"); s.className = "f05-slot"; s.id = "f05-s" + i; grid.appendChild(s); }

          // the late reply thread
          tl.fromTo("#f05-chat", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0.0);
          tl.fromTo("#f05-m1", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.18, ease: "steps(3)" }, 0.2);
          tl.fromTo("#f05-m2", { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.18, ease: "steps(3)" }, 0.72);
          tl.fromTo("#f05-m3", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.18, ease: "steps(3)" }, 1.46);
          tl.to("#f05-chat", { autoAlpha: 0, scale: 0.85, y: -40, duration: 0.25, ease: "power2.in" }, 1.85);

          // clients walk out to the other spa: 2-frame walk cycle, stepped travel
          [["#f05-cl0", "#f05-cl0b", 1.8], ["#f05-cl1", "#f05-cl1b", 2.25]].forEach(function (c) {
            tl.fromTo([c[0], c[1]], { x: -260 }, { x: 560, duration: 1.4, ease: "steps(14)" }, c[2]);
            for (var k = 0; k < 9; k++) {
              var t = c[2] + k * 0.16; var alt = k % 2 === 0;
              tl.set(c[0], { visibility: alt ? "hidden" : "visible" }, t);
              tl.set(c[1], { visibility: alt ? "visible" : "hidden" }, t);
            }
            tl.set([c[0], c[1]], { visibility: "hidden" }, c[2] + 1.42);
          });
          tl.fromTo("#f05-sign", { autoAlpha: 0, scale: 0 }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 1.85);
          tl.to("#f05-sign", { keyframes: [{ scale: 1.15, duration: 0.08 }, { scale: 1, duration: 0.16 }] }, 2.86);

          // the empty week
          tl.fromTo("#f05-agenda", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 3.4);
          for (var j = 0; j < 15; j++) tl.fromTo("#f05-s" + j, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05 }, 3.5 + (j % 5) * 0.05 + Math.floor(j / 5) * 0.08);
          tl.fromTo("#f05-empty", { autoAlpha: 0, scale: 2.2, rotation: -14 }, { autoAlpha: 1, scale: 1, rotation: -8, duration: 0.22, ease: "power4.in" }, 4.22);
          window.__timelines["f05"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
