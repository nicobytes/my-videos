<div class="card" data-card-id="card-08">
  <style>
    .card[data-card-id="card-08"] .root {
      width: 100%;
      height: 100%;
      position: relative;
      background: #0d1117;
      color: #e6edf3;
      font-family: ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 56px 160px;
    }
    .card[data-card-id="card-08"] .panel {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      gap: 36px;
      align-items: stretch;
    }
    .card[data-card-id="card-08"] .kicker {
      color: #7d8590;
      font: 600 20px/1 ui-monospace, Menlo, monospace;
      letter-spacing: 0.16em;
      opacity: 0;
    }
    .card[data-card-id="card-08"] .gone {
      display: flex;
      gap: 36px;
      justify-content: center;
      align-items: center;
      opacity: 0;
    }
    .card[data-card-id="card-08"] .logo-wrap {
      position: relative;
      width: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card[data-card-id="card-08"] .logo-wrap img {
      width: 200px;
      height: auto;
      object-fit: contain;
      opacity: 0.55;
      filter: grayscale(1);
    }
    .card[data-card-id="card-08"] .x {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 700 120px/1 ui-monospace, Menlo, monospace;
      color: #ffffff;
      -webkit-text-stroke: 4px #0d1117;
      paint-order: stroke fill;
      opacity: 0;
      pointer-events: none;
    }
    .card[data-card-id="card-08"] .winner {
      text-align: center;
      opacity: 0;
    }
    .card[data-card-id="card-08"] .winner .mark {
      font: 700 100px/1.05 ui-monospace, Menlo, monospace;
      color: #4ade80;
      margin: 8px 0 16px;
    }
    .card[data-card-id="card-08"] .winner .sub {
      font: 400 32px/1.35 ui-monospace, Menlo, monospace;
      color: #e6edf3;
    }
  </style>
  <div class="root">
    <div class="panel">

          <img id="card-08-nvm" src="assets/logo-nvm.svg" alt="nvm" />

          <img id="card-08-npm" src="assets/logo-npm.png" alt="npm" />

      </div>
      <div class="winner" id="card-08-win" data-anim="fade-in" data-anim-at="1.4" data-anim-duration="0.45">

      </div>

  </div>
