<div class="card" data-card-id="card-03">
  <style>
    .card[data-card-id="card-03"] .root {
      width: 100%;
      height: 100%;
      position: relative;
      background: #0d1117;
      color: #e6edf3;
      font-family: ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 48px 160px;
    }
    .card[data-card-id="card-03"] .panel {
      width: 100%;
      max-width: 960px;
      border: 2px solid #2c333e;
      border-radius: 12px;
      padding: 40px 36px;
      box-sizing: border-box;
      background: #010409;
    }
    .card[data-card-id="card-03"] .titlebar {
      color: #7d8590;
      font: 600 20px/1 ui-monospace, Menlo, monospace;
      letter-spacing: 0.14em;
      margin-bottom: 36px;
      opacity: 0;
    }
    .card[data-card-id="card-03"] .prompt-line {
      font: 500 36px/1.5 ui-monospace, Menlo, monospace;
      margin-bottom: 24px;
      opacity: 0;
      word-break: break-word;
    }
    .card[data-card-id="card-03"] .prompt { color: #4ade80; }
    .card[data-card-id="card-03"] .cmd .flag { color: #fbbf24; }
    .card[data-card-id="card-03"] .cursor {
      display: inline-block;
      width: 16px;
      height: 36px;
      background: #4ade80;
      margin-left: 4px;
      vertical-align: -6px;
      animation: card-03-blink 1s steps(1) infinite;
    }
    @keyframes card-03-blink {
      50% { opacity: 0; }
    }
    .card[data-card-id="card-03"] .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 18px;
      border: 1px solid rgba(74, 222, 128, 0.45);
      border-radius: 8px;
      color: #4ade80;
      font: 600 28px/1 ui-monospace, Menlo, monospace;
      opacity: 0;
    }
    .card[data-card-id="card-03"] .hint {
      margin-top: 40px;
      color: #7d8590;
      font: 400 30px/1.4 ui-monospace, Menlo, monospace;
      opacity: 0;
    }
  </style>
  <div class="root">
    <div class="panel">
      <div class="titlebar" id="card-03-bar" data-anim="fade-in" data-anim-at="0.08" data-anim-duration="0.3">
        RUNTIME · GLOBAL · ~/shell
      </div>
      <div class="prompt-line" id="card-03-cmd" data-anim="fade-in" data-anim-at="0.35" data-anim-duration="0.45">
        <span class="prompt">$</span>
        <span class="cmd">pnpm runtime set node <span class="flag">lts</span> <span class="flag">-g</span></span>
      </div>
      <div class="prompt-line" id="card-03-cursor-line" data-anim="fade-in" data-anim-at="1.0" data-anim-duration="0.25">
        <span class="prompt">$</span><span class="cursor"></span>
      </div>
      <div class="badge" id="card-03-badge" data-anim="fade-in" data-anim-at="1.3" data-anim-duration="0.35">
        Node LTS · managed by pnpm
      </div>
      <div class="hint" id="card-03-hint" data-anim="fade-in" data-anim-at="1.75" data-anim-duration="0.35">
        // integrado en pnpm 12 — sin nvm
      </div>
    </div>
  </div>
</div>
