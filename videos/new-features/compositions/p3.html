      <script>
        const tl = gsap.timeline({ paused: true });
        // Ledger beat: the client's list, the highlight steps to this row.
        tl.fromTo("#p3-led", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.42, ease: "power3.inOut" }, 0);
        tl.fromTo("#p3-hl", { y: 322 }, { y: 406, duration: 0.55, ease: "power3.inOut" }, 0.3);
      tl.fromTo("#p3-st2", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.2, ease: "expo.out" }, 0.62);
        tl.fromTo("#p3-rt3", { color: "#312A23" }, { color: "#A4583A", duration: 0.25, ease: "power2.out" }, 0.95);
        // Push into the row, then the card takes the frame.
        tl.fromTo("#p3-sheet", { scale: 1, filter: "blur(0px)" }, { scale: 1.45, filter: "blur(10px)", duration: 0.55, ease: "power3.in" }, 1.95);
        tl.fromTo("#p3-led", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.25);
        tl.fromTo("#p3-lbl", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 2.35);
        tl.fromTo(".p3-tw", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 2.45);
        tl.fromTo("#p3-desc", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 3.002);
        tl.fromTo("#p3-meta", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 3.182);
        // The verdict: stamped when Nicolás says it.
        tl.fromTo("#p3-stamp", { opacity: 0, scale: 1.35, rotation: -7 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.22, ease: "expo.out" }, 21.827);
        tl.fromTo("#p3-answer", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 22.127);
      tl.to("#p3-ans", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 29.847);
      tl.fromTo("#p3-new", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 30.047);
      tl.fromTo("#p3-newchip", { opacity: 0, scale: 1.35, rotation: -6 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.22, ease: "expo.out" }, 30.047);
      tl.fromTo(".p3-nw", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 30.297);
      tl.fromTo("#p3-newb", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 30.966);
        // Hidden while the screen or the camera covers the card.
        tl.set("#p3-panel", { opacity: 0 }, 47.173);
        tl.set("#p3-panel", { opacity: 1 }, 273.3);
        window.__timelines["p3"] = tl;
      </script>
