      <script>
        (function () {
          var R = window.Reel;
          var P = window.Physics;
          var A = R.A;
          var S = R.S;
          function $(id) {
            return document.getElementById("c12-" + id);
          }
          var st = $("st");
          var q = $("q");
          var a = $("a");
          var s0 = $("s0");
          var s2 = $("s2");
          var ANS = R.beatNear(A.responder);
          window.__timelines["c12"] = R.mountState("inbox", $("root"), $("world"), $("clip"), function (t, span) {
            R.apply(st, t, span[0], span[1]);
            R.pop(q, t, S.inbox + 0.3);
            R.pop(a, t, ANS);
            R.pop(s0, t, ANS + 0.2);
            R.pop(s2, t, ANS + 0.45);
            var picked = R.beatNear(A.consultas) + 0.75;
            var dim = 1 - 0.5 * R.smooth((t - picked) / 0.3);
            if (t > picked) {
              s0.style.opacity = Math.min(Number(s0.style.opacity), dim).toFixed(3);
              s2.style.opacity = Math.min(Number(s2.style.opacity), dim).toFixed(3);
            }
          });
