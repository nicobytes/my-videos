      <script>
        (function () {
          var R = window.Reel;
          var P = window.Physics;
          var A = R.A;
          var S = R.S;
          function $(id) {
            return document.getElementById("c11-" + id);
          }
          var st = $("st");
          var logo = $("logo");
          var lift = $("lift");
          var liftSt = $("lift-st");
          var word = $("word");
          var sub = $("sub");
          var SENT = [0, 1, 2, 3].map(function (i) {
            return R.beatAfter(A.automatizar, i);
          });
          // The pill stamps each row; once it moves on, the row keeps its final status.
          var FINAL = [0, 1, 2, 3].map(function (i) {
            return i < 3 ? R.beatAfter(A.gestionar, 2 * (i + 1)) : S.inbox;
          });
          var stamp = [0, 1, 2, 3].map(function (i) {
            return i === 0 ? R.beatNear(A.gestionar) : R.beatAfter(A.gestionar, 2 * i);
          });
          var chips = [0, 1, 2, 3].map(function (i) {
            return [$("s" + i + "a"), $("s" + i + "b"), $("s" + i + "c")];
          });
          window.__timelines["c11"] = R.mountState("parlana", $("root"), $("world"), $("clip"), function (t, span) {
            R.apply(st, t, span[0], span[1]);
            R.apply(liftSt, t, span[0], span[1]);
            lift.style.transform = R.place(t, R.SLAB_TOP + R.logoLift(t).h);
            R.pop(logo, t, R.logoLift(t).at);
            R.pop(word, t, R.beatNear(A.parlana));
            R.fadeAt(sub, t, R.beatNear(A.parlana) + 0.35);
            chips.forEach(function (c, i) {
              var stage = t < SENT[i] ? 0 : t < stamp[i] ? 1 : t < FINAL[i] ? -1 : 2; // -1: under the pill
              c.forEach(function (el, k) {
                el.style.opacity = k === stage ? "1" : "0";
              });
              if (stage === 1) R.pop(c[1], t, SENT[i]);
            });
          });
        })();
      </script>
