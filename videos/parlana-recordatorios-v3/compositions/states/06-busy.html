      <!-- 6 · Busy: 'entre atenderlos, responder mensajes…' — messages pile up; 'alguno se te puede pasar'. -->
      <div data-hf-id="hf-3avd" id="c06-root" data-composition-id="c06" data-start="0" data-duration="8.01" data-width="1080" data-height="1920">
        <div data-hf-id="hf-2exr" id="c06-world" class="world" data-layout-allow-overflow>
          <div data-hf-id="hf-xbxo" id="c06-clip" class="clip-layer">
            <div data-hf-id="hf-v4vc" id="c06-st" class="st">
              <div data-hf-id="hf-b94k" id="c06-unread" class="abs">WhatsApp · <span data-hf-id="hf-5i7l" id="c06-un">2</span> sin leer</div>
              <div data-hf-id="hf-cf7o" id="c06-n0" class="abs c06-note"><div data-hf-id="hf-z3uc" class="wa"><svg data-hf-id="hf-t6g8" class="ico" viewBox="0 0 24 24" aria-hidden="true"><path data-hf-id="hf-nkex" d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.1A8.5 8.5 0 1 1 21 12z" /></svg></div><div data-hf-id="hf-yeow"><b data-hf-id="hf-ojdu">Carla</b><span data-hf-id="hf-39ef">¿Tienen turno mañana?</span></div></div>
              <div data-hf-id="hf-d6vh" id="c06-n1" class="abs c06-note"><div data-hf-id="hf-aslo" class="wa"><svg data-hf-id="hf-bbvk" class="ico" viewBox="0 0 24 24" aria-hidden="true"><path data-hf-id="hf-3d9p" d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.1A8.5 8.5 0 1 1 21 12z" /></svg></div><div data-hf-id="hf-y7yw"><b data-hf-id="hf-tlp3">Diego</b><span data-hf-id="hf-hh4r">¿Cuánto cuesta una limpieza?</span></div></div>
              <div data-hf-id="hf-h4zi" id="c06-n2" class="abs c06-note"><div data-hf-id="hf-9lol" class="wa"><svg data-hf-id="hf-a4yh" class="ico" viewBox="0 0 24 24" aria-hidden="true"><path data-hf-id="hf-4k6s" d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.1A8.5 8.5 0 1 1 21 12z" /></svg></div><div data-hf-id="hf-x11t"><b data-hf-id="hf-4k8h">Sofía</b><span data-hf-id="hf-yqxw">¿Atienden el sábado?</span></div></div>
              <div data-hf-id="hf-l33j" id="c06-n3" class="abs c06-note"><div data-hf-id="hf-9zzm" class="wa"><svg data-hf-id="hf-aj9i" class="ico" viewBox="0 0 24 24" aria-hidden="true"><path data-hf-id="hf-45vr" d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.1A8.5 8.5 0 1 1 21 12z" /></svg></div><div data-hf-id="hf-xfcu"><b data-hf-id="hf-d2iz">Mario</b><span data-hf-id="hf-gyan">Quisiera agendar una cita</span></div></div>

        <!-- v3: Juan's reminder on its own plane over the slab, so it can hang past the edge and tip off it. -->
        <div id="c06-fall" class="world" data-layout-allow-overflow>
          <div id="c06-fall-st" class="st">
            <div data-hf-id="hf-bj05" id="c06-task" class="abs" data-layout-allow-occlusion><svg data-hf-id="hf-9qng" class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect data-hf-id="hf-4tln" x="4" y="4" width="16" height="16" rx="4" /></svg>Recordatorio a Juan · 10:00<em data-hf-id="hf-cbrl" data-layout-allow-occlusion>pendiente</em></div>

        </div>

      <script>
        (function () {
          var R = window.Reel;
          var P = window.Physics;
          var A = R.A;
          var S = R.S;
          function $(id) {
            return document.getElementById("c06-" + id);
          }
          var st = $("st");
          var ARR = [A.mensajes, A.ocuparte, A.implica, A.negocio, A.tiempo2].map(R.beatNear);
          var notes = [0, 1, 2, 3, 4].map(function (i) {
            var keys = [{ t: ARR[i], v: 612, w: 16, z: 0.78 }];
            var y = 612;
            ARR.forEach(function (a) {
              if (a > ARR[i] + 1e-6) {
                y += 128;
                keys.push({ t: a, v: y, w: 14, z: 0.78 });
              }
            });
            return { el: $("n" + i), at: ARR[i], y: P.track(560, keys) };
          });
          // v3: each message pushes Juan's row towards the slab's edge (1296) until it hangs half over it, teetering.
          var PUSH = [1188, 1214, 1232, 1242, 1246];
          var taskKeys = ARR.map(function (a, k) {
            return { t: a, v: PUSH[k], w: 12, z: 0.8 };
          });
          var taskY = P.track(1150, taskKeys);
          var task = $("task");
          var fall = $("fall");
          var fallSt = $("fall-st");
          // "…alguno se te puede pasar": it tips over the edge, slides off and drops away.
          var TIP = R.beatNear(A.alguno);
          var M = R.mat;
          function tip(t) {
            var u = t - TIP;
            if (u <= 0) return { slide: 0, model: null, fade: 1 };
            var a = Math.min(1.9, 8 * u * u); // rad: gravity swings it about the edge
            var drop = u > 0.28 ? 2600 * (u - 0.28) * (u - 0.28) : 0; // then it falls free
            var e = R.shell(t).b - R.BEVEL; // the edge of the slab's top face
            var z = R.SLAB_TOP;
            var model = M.chain(M.translate(0, -e, z - drop), M.rotX(a), M.translate(0, e, -z));
            return { slide: 90 * u + 450 * u * u, model: model, fade: 1 - R.smooth((u - 0.3) / 0.3) };
          }
          var un = $("un");
          window.__timelines["c06"] = R.mountState("busy", $("root"), $("world"), $("clip"), function (t, span) {
            R.apply(st, t, span[0], span[1]);
            var n = ARR.filter(function (a) {
              return t >= a;
            }).length;
            un.textContent = String([2, 5, 8, 11, 13, 15][n]);
            notes.forEach(function (o) {
              o.el.style.opacity = R.smooth((t - o.at) / 0.15).toFixed(3);
              o.el.style.transform = "translateY(" + o.y(t).toFixed(2) + "px)";
            });
            var f = tip(t);
            R.apply(fallSt, t, span[0], span[1]);
            fall.style.transform = R.place(t, R.SLAB_TOP, f.model);
            task.style.transform = "translateY(" + (taskY(t) + f.slide).toFixed(2) + "px)";
            task.style.opacity = ((1 - 0.08 * n) * f.fade).toFixed(3); // v3: dims less; the fall says it's lost
          });
        })();
      </script>
