      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const IN = { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" };

        tl.fromTo("#head", { opacity: 0, y: 40 }, { ...IN }, 0.1);
        tl.fromTo("#logo-chip", { opacity: 0, scale: 0.82, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2)" }, 0.45);
        tl.fromTo("#runs-lbl", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.1);

        const pillIn = (sel, at) =>
          tl.fromTo(sel, { opacity: 0, scale: 0.85, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(2.2)" }, at);
        pillIn("#pill-1", 1.25);

        pillIn("#pill-4", 1.61);
        pillIn("#pill-5", 1.73);
        pillIn("#pill-6", 1.85);

        window.__timelines["card-hono"] = tl;
        tl.seek(0);

        // Drive from the HOST's global hf-seek time ourselves and self-blank
        // outside this clip's own window — see card-clouds.html for why.
        const HOST_START = 136.24;
        const DURATION = 5.0;
        const root = document.querySelector('[data-composition-id="card-hono"]');
        function renderAt(globalTime) {
          const inWindow = globalTime >= HOST_START && globalTime <= HOST_START + DURATION;
          root.style.opacity = inWindow ? "1" : "0";
          const local = Math.min(DURATION, Math.max(0, globalTime - HOST_START));
          tl.seek(local);
        }
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(window.__hfThreeTime || 0);
      </script>
