<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="compositions/shared/parlana.css" />
  </head>
  <body>
    <template id="f11-template">
      <style>
        @font-face { font-family: "Fraunces"; src: url("assets/fonts/fraunces-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Fraunces"; src: url("assets/fonts/fraunces-700.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree-400.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree-500.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree-700.woff2") format("woff2"); font-weight: 700; }
        #f11-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        /* The card surface is painted by the shell track. */
        #f11-card {
          left: 110px;
          top: 370px;
          width: 860px;
          height: 940px;
          padding: 48px;
          background: transparent;
          border-color: transparent;
          box-shadow: none;
        }
        #f11-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          height: 72px;
        }
        #f11-brand {
          display: flex;
          align-items: center;
          gap: 18px;
        }
        #f11-logo {
          width: 72px;
          height: auto;
          display: block;
        }
        #f11-word {
          font-size: 54px;
          color: var(--green-text);
        }
        #f11-week {
          font-size: 32px;
          font-weight: 600;
          color: var(--muted);
        }
        #f11-days,
        #f11-grid {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          gap: 16px;
        }
        #f11-days {
          margin-top: 44px;
          text-align: center;
          font-size: 28px;
          color: var(--muted);
        }
        #f11-grid {
          margin-top: 18px;
        }
        .f11-cell {
          position: relative;
          height: 178px;
        }
        .f11-layer {
          position: absolute;
          inset: 0;
          border-radius: 26px;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
        }
        .f11-layer svg {
          width: 44px;
          height: 44px;
        }
        .f11-hour {
          font-size: 32px;
          font-weight: 700;
        }
        .f11-pend {
          background: var(--surface);
          color: var(--muted);
          border: 2px dashed var(--line);
        }
        .f11-ok {
          background: var(--green-tint);
          color: var(--green-text);
        }
        .f11-move {
          background: var(--cream);
          color: var(--ink);
          border: 2px solid var(--line);
        }
        #f11-legend {
          margin-top: 40px;
          display: flex;
          gap: 16px;
        }
      </style>

      <div data-hf-id="hf-k52c" id="f11-root" data-composition-id="f11" data-start="0" data-duration="4.55" data-width="1080" data-height="1920">
        <div data-hf-id="hf-fppw" id="f11-card" class="pr-card">
          <div data-hf-id="hf-s8wu" id="f11-head">
            <div data-hf-id="hf-g7mn" id="f11-brand">
              <img data-hf-id="hf-201d" id="f11-logo" src="assets/brand/parlana-logo.svg" alt="" />
              <span data-hf-id="hf-jsca" id="f11-word" class="pr-display">Parlana</span>
            </div>
            <span data-hf-id="hf-yj4v" id="f11-week" class="pr-ui">Semana de Ana</span>
          </div>
          <div data-hf-id="hf-u9ax" id="f11-days" class="pr-data"><span data-hf-id="hf-csfs">LUN</span><span data-hf-id="hf-3wl3">MAR</span><span data-hf-id="hf-ngm2">MIÉ</span><span data-hf-id="hf-8xqj">JUE</span><span data-hf-id="hf-k877">VIE</span></div>
          <div data-hf-id="hf-inns" id="f11-grid"></div>
          <div data-hf-id="hf-x0hn" id="f11-legend">
            <span data-hf-id="hf-fj2t" class="pr-chip pr-chip--green">✓ Confirmada</span>
            <span data-hf-id="hf-nfhg" class="pr-chip pr-chip--neutral">↻ Reprogramada</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // VO cues, frame-local seconds (from assets/vo/transcript.json):
          // "Con nuestros agentes, cada cita se recuerda y se confirma sola en el mismo chat."
          var CUE = { head: 0.3, days: 0.45, cells: 0.5, wave: 2.5, legend: 3.55, out: 4.37 };
          var ICONS = {
            ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>',
            move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6" /><path d="M20 4v4.5h-4.5" /></svg>',
            wait: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="18" cy="12" r="2" /></svg>',
          };
          var HOURS = ["09:00", "10:00", "11:00"];
          // Ana's week: most confirm, one is rescheduled in the same chat, one is still pending.
          var OUTCOME = function (row, day) {
            if (row === 1 && day === 2) return "move";
            if (row === 2 && day === 4) return "wait";
            return "ok";
          };

          var grid = document.getElementById("f11-grid");
          var cells = [];
          HOURS.forEach(function (hour, row) {
            for (var day = 0; day < 5; day++) {
              var cell = document.createElement("div");
              cell.className = "f11-cell";
              // Two states of one slot, stacked on purpose; the flip swaps which one shows.
              cell.setAttribute("data-layout-allow-overlap", "");
              var pend = document.createElement("div");
              pend.className = "f11-layer f11-pend";
              pend.innerHTML = '<span class="f11-hour pr-data">' + hour + "</span>" + ICONS.wait;
              cell.appendChild(pend);
              var outcome = OUTCOME(row, day);
              var flip = null;
              if (outcome !== "wait") {
                flip = document.createElement("div");
                flip.className = "f11-layer " + (outcome === "ok" ? "f11-ok" : "f11-move");
                flip.innerHTML = '<span class="f11-hour pr-data">' + hour + "</span>" + ICONS[outcome];
                cell.appendChild(flip);
              }
              grid.appendChild(cell);
              cells.push({ el: cell, pend: pend, flip: flip, day: day });
            }
          });

          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#f11-head", { opacity: 0, y: 18, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.26, ease: "power2.out" }, CUE.head);
          tl.fromTo("#f11-days", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, CUE.days);

          // The week assembles column by column, all pending (grid-card-assemble, ~0.4s).
          cells.forEach(function (c) {
            tl.fromTo(c.el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, CUE.cells + c.day * 0.08);
          });

          // "…y se confirma sola": the statuses flip in reading order (live status flips).
          cells.forEach(function (c, i) {
            if (!c.flip) return;
            tl.fromTo(c.flip, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, CUE.wave + i * 0.05);
            tl.fromTo(c.pend, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in" }, CUE.wave + i * 0.05 + 0.05);
          });

          tl.fromTo("#f11-legend", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, CUE.legend);

          tl.fromTo(["#f11-head", "#f11-days", "#f11-grid", "#f11-legend"], { filter: "blur(0px)" }, { opacity: 0, y: -18, filter: "blur(8px)", duration: 0.18, ease: "power2.in", immediateRender: false }, CUE.out);

          window.__timelines["f11"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
