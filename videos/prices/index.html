         <video> inside owns data-start (no nested timed ancestors). */

      #cam-shake {
        position: absolute;

        width: 1080px;

      #flash {

        left: 0;
        top: 0;

        height: 1920px;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
      }

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var cam = document.getElementById("cam");
        var shakeEl = document.getElementById("cam-shake");
        var flash = document.getElementById("flash");
        var END = 135.3;

        // Shot list: [time, scale, kind]. c = hard punch cut (jump zoom on a
        // phrase boundary), s = snap-zoom (fast ease, lands ON the stressed
        // word), e = smooth ease back out. Every shot also pushes in ~3.5%
        // across its length so the frame is never dead-static.
        var SHOTS = [
          [0, 1.0, "c"], [2.46, 1.32, "s"], [4.0, 1.12, "c"], [6.68, 1.0, "c"], [10.02, 1.4, "s"],
          [12.24, 1.08, "c"], [15.56, 1.28, "c"], [20.04, 1.45, "s"], [22.08, 1.0, "c"], [24.84, 1.25, "c"],
          [27.84, 1.1, "c"], [31.04, 1.38, "c"], [35.04, 1.0, "c"], [38.84, 1.25, "c"], [42.28, 1.1, "c"],
          [45.84, 1.35, "c"], [50.0, 1.15, "c"], [53.68, 1.4, "c"], [56.72, 1.05, "c"], [62.08, 1.3, "c"],
          [65.04, 1.0, "c"], [65.62, 1.55, "s"], [67.6, 1.15, "e"], [72.16, 1.3, "c"], [76.16, 1.1, "c"],
          [78.16, 1.45, "s"], [80.88, 1.2, "c"], [83.08, 1.05, "c"], [86.88, 1.3, "c"], [90.64, 1.15, "c"],
          [95.04, 1.35, "c"], [98.32, 1.05, "c"], [100.95, 1.3, "c"], [103.24, 1.1, "c"], [106.64, 1.4, "c"],
          [109.88, 1.0, "c"], [114.24, 1.25, "c"], [119.49, 1.1, "c"], [122.0, 1.35, "c"], [125.04, 1.05, "c"],
          [127.12, 1.25, "c"], [130.78, 1.5, "s"], [132.32, 1.0, "c"],
        ];
        var PUSH = 1.035;

        gsap.set(cam, { transformOrigin: "500px 960px", scale: 1 });
        SHOTS.forEach(function (sh, i) {
          var t = sh[0], s = sh[1], kind = sh[2];
          var next = i < SHOTS.length - 1 ? SHOTS[i + 1][0] : END;
          var prevEnd = i > 0 ? SHOTS[i - 1][1] * PUSH : 1;
          var settle = 0;
          if (kind === "c") {
            tl.set(cam, { scale: s }, t);
          } else {
            settle = kind === "s" ? 0.2 : 0.5;
            tl.fromTo(cam, { scale: prevEnd }, { scale: s, duration: settle, ease: kind === "s" ? "power4.out" : "power2.inOut", immediateRender: false }, t);
          }
          tl.fromTo(cam, { scale: s }, { scale: s * PUSH, duration: Math.max(0.1, next - t - settle), ease: "none", immediateRender: false }, t + settle);
        });

        // Impact shakes — finite, decaying, each launched by a hit word.
        function shake(t, a) {
          tl.to(shakeEl, { keyframes: [
            { x: a, y: -a * 0.6, rotation: 0.4, duration: 0.04 },
            { x: -a * 0.8, y: a * 0.5, rotation: -0.35, duration: 0.05 },
            { x: a * 0.5, y: a * 0.3, rotation: 0.2, duration: 0.05 },
            { x: -a * 0.25, y: -a * 0.2, rotation: -0.1, duration: 0.06 },
            { x: 0, y: 0, rotation: 0, duration: 0.08 }], ease: "none" }, t);
        }
        shake(2.62, 14); shake(20.2, 12); shake(65.8, 22); shake(80.98, 22); shake(104.3, 10); shake(130.9, 10);

        function flashHit(t, peak) {
          tl.fromTo(flash, { opacity: peak }, { opacity: 0, duration: 0.28, ease: "power2.out", immediateRender: false }, t);
        }
        flashHit(65.72, 0.75); flashHit(80.98, 0.6);
        tl.set(flash, { opacity: 0 }, END - 0.05);

        window.__timelines["main"] = tl;
      })();
