      <script>
        (function () {
          var R = window.Reel;
          var P = window.Physics;
          var A = R.A;
          var S = R.S;
          function $(id) {
            return document.getElementById("c13-" + id);
          }
          var st = $("st");
          var left = $("left");
          var right = $("right");
          var msgs = [0, 1, 2].map(function (i) {
            return { el: $("m" + i), k: $("k" + i), at: R.beatAfter(A.escriben - 0.6, i), done: R.beatAfter(A.escriben, i + 1) };
          });
          var cells = [];
          for (var r = 0; r < 3; r++) {
            for (var c = 0; c < 5; c++) {
              var el = $("c" + r + "" + c);
              cells.push({ el: el, i: el.querySelector("i"), b: el.querySelector("b"), k: r * 5 + c });
            }
          }
          var ORG = R.beatNear(A.organizar);
          var REM = R.beatNear(A.recordarles);
          window.__timelines["c13"] = R.mountState("split", $("root"), $("world"), $("clip"), function (t, span) {
            R.apply(st, t, span[0], span[1]);
            // Attention follows the voice: left on "quienes llegan", right on "quienes te escriben".
            var toRight = R.smooth((t - (A.escriben - 0.5)) / 0.4);
            var toLeft = R.smooth((t - (A.llegan - 0.4)) / 0.4) * (1 - toRight);
            left.style.opacity = (0.55 + 0.45 * Math.max(toLeft, t < A.llegan - 0.4 ? 1 : 0, 1 - toRight)).toFixed(3);
            right.style.opacity = (0.55 + 0.45 * Math.max(toRight, t < A.llegan - 0.4 ? 1 : 0)).toFixed(3);
            msgs.forEach(function (m) {
              R.pop(m.el, t, m.at);
              R.fadeAt(m.k, t, m.done, 0.15);
            });
            // "organizar las citas": the week fills in reading order; "recordarles": a bell on each.
            cells.forEach(function (c) {
              var a = ORG + c.k * 0.05;
              var on = t >= a;
              c.el.style.borderStyle = on ? "solid" : "dashed";
              c.el.style.borderColor = on ? "#E7F0EB" : "#D3D1C7";
              c.el.style.background = on ? "#E7F0EB" : "transparent";
              c.el.style.color = on ? "#155B3F" : "#8A8880";
              c.i.style.opacity = on ? "1" : "0";
              c.el.style.transform = "scale(" + (on ? 0.9 + 0.1 * P.step(t - a, 18, 0.7) : 1).toFixed(4) + ")";
              c.b.style.opacity = R.smooth((t - (REM + c.k * 0.04)) / 0.12).toFixed(3);
            });
          });
        })();
      </script>
